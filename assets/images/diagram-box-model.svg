<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="t d">
  <title id="t">The CSS box model</title>
  <desc id="d">Four nested rectangles. From the outside in: margin, border, padding and content.</desc>
  <rect width="640" height="280" rx="18" fill="#0f1630"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#e9edfb" text-anchor="middle">
    <rect x="140" y="20" width="360" height="240" rx="10" fill="#2a2512" stroke="#f4b84d" stroke-dasharray="6 5" stroke-width="2"/>
    <text x="320" y="42" fill="#f3cc55" font-weight="700">margin (space outside)</text>
    <rect x="175" y="56" width="290" height="176" rx="8" fill="#16233f" stroke="#7db0ff" stroke-width="4"/>
    <text x="320" y="78" fill="#7db0ff" font-weight="700">border</text>
    <rect x="205" y="88" width="230" height="116" rx="6" fill="#1d2d22" stroke="#35d08f" stroke-width="2"/>
    <text x="320" y="108" fill="#8fe3b0" font-weight="700">padding (space inside)</text>
    <rect x="240" y="120" width="160" height="62" rx="4" fill="#3a2a6a" stroke="#b9a9ff" stroke-width="2"/>
    <text x="320" y="156" font-weight="700">content</text>
  </g>
</svg>
